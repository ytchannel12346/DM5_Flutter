name: dm5_flutter
description: A Flutter comic reader app.
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  dio: ^5.4.0
  html: ^0.15.4
  cached_network_image: ^3.3.1
  shared_preferences: ^2.2.2
  sqflite: ^2.3.3
  file_picker: ^8.0.0
  archive: ^3.6.1
  path_provider: ^2.1.3

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0

flutter:
  uses-material-design: true
