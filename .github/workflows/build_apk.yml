name: Build and Release APK & IPA

on:
  workflow_dispatch:
    inputs:
      release_tag:
        description: 'Release 版本標籤（例如 v1.0.100，留空則使用 v1.0.<run_number>）'
        required: false
        type: string
        default: ''
      build_android:
        description: '編譯 Android APK'
        required: true
        type: boolean
        default: true
      build_ios:
        description: '編譯 iOS IPA'
        required: true
        type: boolean
        default: false

permissions:
  contents: write

jobs:
  build_android:
    if: inputs.build_android == true
    runs-on: ubuntu-latest
    outputs:
      version_name: ${{ steps.set_ver.outputs.version_name }}
      tag_name: ${{ steps.set_ver.outputs.tag_name }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Resolve version and tag
        id: set_ver
        run: |
          RAW_TAG="${{ inputs.release_tag }}"
          if [ -z "$RAW_TAG" ]; then
            TAG="v1.0.${{ github.run_number }}"
          elif [[ "$RAW_TAG" == v* ]]; then
            TAG="$RAW_TAG"
          else
            TAG="v$RAW_TAG"
          fi
          VER="${TAG#v}"
          echo "tag_name=$TAG" >> "$GITHUB_OUTPUT"
          echo "version_name=$VER" >> "$GITHUB_OUTPUT"

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Generate Android project if missing
        run: |
          if [ ! -d "android" ]; then
            flutter create . --platforms=android --org com.example.comicreader
          fi

      - name: Force compileSdk 36 for plugins
        run: |
          if [ -f "android/build.gradle.kts" ]; then
            cat << 'EOF' >> android/build.gradle.kts

          subprojects {
              val fixSdk: Project.() -> Unit = {
                  extensions.findByType<com.android.build.gradle.BaseExtension>()?.compileSdkVersion(36)
              }
              if (state.executed) {
                  fixSdk()
              } else {
                  afterEvaluate { fixSdk() }
              }
          }
          EOF
          elif [ -f "android/build.gradle" ]; then
            cat << 'EOF' >> android/build.gradle

          subprojects {
              def fixSdk = { proj ->
                  if (proj.hasProperty('android')) {
                      proj.android {
                          compileSdkVersion 36
                      }
                  }
              }
              if (state.executed) {
                  fixSdk(project)
              } else {
                  afterEvaluate { fixSdk(project) }
              }
          }
          EOF
          fi

      - name: Ensure INTERNET and cleartext traffic permissions
        run: |
          MANIFEST="android/app/src/main/AndroidManifest.xml"
          if ! grep -q "android.permission.INTERNET" "$MANIFEST"; then
            sed -i 's/<application/<uses-permission android:name="android.permission.INTERNET"\/>\n    <application/' "$MANIFEST"
          fi
          if ! grep -q "usesCleartextTraffic" "$MANIFEST"; then
            sed -i 's/<application/<application android:usesCleartextTraffic="true"/' "$MANIFEST"
          fi

      - name: Install dependencies
        run: flutter pub get

      - name: Build Release APK
        run: >
          flutter build apk --release
          --build-name=${{ steps.set_ver.outputs.version_name }}
          --build-number=${{ github.run_number }}
          --dart-define=APP_VERSION=${{ steps.set_ver.outputs.version_name }}

      - name: Align and Sign APK with fixed Keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
        run: |
          SRC_APK="build/app/outputs/flutter-apk/app-release.apk"
          ALIGNED_APK="build/app/outputs/flutter-apk/app-aligned.apk"
          ZIPALIGN=$(find "$ANDROID_HOME/build-tools" -name zipalign | sort -V | tail -n 1)
          APKSIGNER=$(find "$ANDROID_HOME/build-tools" -name apksigner | sort -V | tail -n 1)

          "$ZIPALIGN" -p -f -v 4 "$SRC_APK" "$ALIGNED_APK"
          mv "$ALIGNED_APK" "$SRC_APK"

          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "$KEYSTORE_BASE64" | base64 --decode > release.jks
            "$APKSIGNER" sign \
              --ks release.jks \
              --ks-key-alias comicreader \
              --ks-pass "pass:$KEYSTORE_PASSWORD" \
              --key-pass "pass:$KEYSTORE_PASSWORD" \
              "$SRC_APK"
            "$APKSIGNER" verify --print-certs "$SRC_APK"
          fi

      - name: Rename APK
        run: cp build/app/outputs/flutter-apk/app-release.apk "comic-reader-${{ steps.set_ver.outputs.tag_name }}.apk"

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: release-files-android
          path: "comic-reader-${{ steps.set_ver.outputs.tag_name }}.apk"

  build_ios:
    if: inputs.build_ios == true
    runs-on: macos-latest
    outputs:
      version_name: ${{ steps.set_ver.outputs.version_name }}
      tag_name: ${{ steps.set_ver.outputs.tag_name }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Resolve version and tag
        id: set_ver
        run: |
          RAW_TAG="${{ inputs.release_tag }}"
          if [ -z "$RAW_TAG" ]; then
            TAG="v1.0.${{ github.run_number }}"
          elif [[ "$RAW_TAG" == v* ]]; then
            TAG="$RAW_TAG"
          else
            TAG="v$RAW_TAG"
          fi
          VER="${TAG#v}"
          echo "tag_name=$TAG" >> "$GITHUB_OUTPUT"
          echo "version_name=$VER" >> "$GITHUB_OUTPUT"

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Generate iOS project if missing
        run: |
          if [ ! -d "ios" ]; then
            flutter create . --platforms=ios --org com.example.comicreader
          fi

      - name: Allow HTTP image loading in Info.plist
        run: |
          PLIST="ios/Runner/Info.plist"
          /usr/libexec/PlistBuddy -c "Add :NSAppTransportSecurity dict" "$PLIST" || true
          /usr/libexec/PlistBuddy -c "Set :NSAppTransportSecurity:NSAllowsArbitraryLoads true" "$PLIST" || \
          /usr/libexec/PlistBuddy -c "Add :NSAppTransportSecurity:NSAllowsArbitraryLoads bool true" "$PLIST"

      - name: Install dependencies
        run: flutter pub get

      - name: Build Unsigned iOS App
        run: >
          flutter build ios --release --no-codesign
          --build-name=${{ steps.set_ver.outputs.version_name }}
          --build-number=${{ github.run_number }}
          --dart-define=APP_VERSION=${{ steps.set_ver.outputs.version_name }}

      - name: Package Unsigned IPA
        run: |
          mkdir -p Payload
          cp -r build/ios/iphoneos/Runner.app Payload/
          zip -r "comic-reader-${{ steps.set_ver.outputs.tag_name }}.ipa" Payload

      - name: Upload IPA artifact
        uses: actions/upload-artifact@v4
        with:
          name: release-files-ios
          path: "comic-reader-${{ steps.set_ver.outputs.tag_name }}.ipa"

  release:
    needs: [ build_android, build_ios ]
    if: always() && (needs.build_android.result == 'success' || needs.build_ios.result == 'success')
    runs-on: ubuntu-latest
    steps:
      - name: Download Android APK
        if: needs.build_android.result == 'success'
        uses: actions/download-artifact@v4
        with:
          name: release-files-android
          path: release_assets

      - name: Download iOS IPA
        if: needs.build_ios.result == 'success'
        uses: actions/download-artifact@v4
        with:
          name: release-files-ios
          path: release_assets

      - name: Create Versioned GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.build_android.outputs.tag_name || needs.build_ios.outputs.tag_name }}
          name: Release ${{ needs.build_android.outputs.version_name || needs.build_ios.outputs.version_name }}
          generate_release_notes: true
          files: release_assets/*
