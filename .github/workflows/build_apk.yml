name: Build and Release APK & IPA

on:
  workflow_dispatch:
    inputs:
      build_android:
        description: '編譯 Android APK'
        required: true
        type: boolean
        default: true
      build_ios:
        description: '編譯 iOS IPA (消耗較多額度)'
        required: true
        type: boolean
        default: false

permissions:
  contents: write

jobs:
  build_android:
    if: inputs.build_android == true
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Generate Android project if missing
        run: |
          if [ ! -d "android" ]; then
            flutter create . --platforms=android --org com.example.comicreader
          fi

      - name: Ensure INTERNET and cleartext traffic permissions
        run: |
          MANIFEST="android/app/src/main/AndroidManifest.xml"
          if ! grep -q "android.permission.INTERNET" "$MANIFEST"; then
            sed -i 's/<application/<uses-permission android:name="android.permission.INTERNET"\/>\n    <application/' "$MANIFEST"
          fi
          if ! grep -q "usesCleartextTraffic" "$MANIFEST"; then
            sed -i 's/<application/<application android:usesCleartextTraffic="true"/' "$MANIFEST"
          fi

      - name: Install dependencies
        run: flutter pub get

      - name: Build Release APK
        run: >
          flutter build apk --release
          --build-name=1.0.${{ github.run_number }}
          --build-number=${{ github.run_number }}
          --dart-define=APP_VERSION=1.0.${{ github.run_number }}

      - name: Sign APK with fixed Keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "$KEYSTORE_BASE64" | base64 --decode > release.jks
            APKSIGNER=$(find "$ANDROID_HOME/build-tools" -name apksigner | sort -V | tail -n 1)
            "$APKSIGNER" sign \
              --ks release.jks \
              --ks-key-alias comicreader \
              --ks-pass "pass:$KEYSTORE_PASSWORD" \
              --key-pass "pass:$KEYSTORE_PASSWORD" \
              build/app/outputs/flutter-apk/app-release.apk
          fi

      - name: Rename APK
        run: cp build/app/outputs/flutter-apk/app-release.apk comic-reader-v1.0.${{ github.run_number }}.apk

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: release-files-android
          path: comic-reader-v1.0.${{ github.run_number }}.apk

  build_ios:
    if: inputs.build_ios == true
    runs-on: macos-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Generate iOS project if missing
        run: |
          if [ ! -d "ios" ]; then
            flutter create . --platforms=ios --org com.example.comicreader
          fi

      - name: Allow HTTP image loading in Info.plist
        run: |
          PLIST="ios/Runner/Info.plist"
          /usr/libexec/PlistBuddy -c "Add :NSAppTransportSecurity dict" "$PLIST" || true
          /usr/libexec/PlistBuddy -c "Set :NSAppTransportSecurity:NSAllowsArbitraryLoads true" "$PLIST" || \
          /usr/libexec/PlistBuddy -c "Add :NSAppTransportSecurity:NSAllowsArbitraryLoads bool true" "$PLIST"

      - name: Install dependencies
        run: flutter pub get

      - name: Build Unsigned iOS App
        run: >
          flutter build ios --release --no-codesign
          --build-name=1.0.${{ github.run_number }}
          --build-number=${{ github.run_number }}
          --dart-define=APP_VERSION=1.0.${{ github.run_number }}

      - name: Package Unsigned IPA
        run: |
          mkdir -p Payload
          cp -r build/ios/iphoneos/Runner.app Payload/
          zip -r comic-reader-v1.0.${{ github.run_number }}.ipa Payload

      - name: Upload IPA artifact
        uses: actions/upload-artifact@v4
        with:
          name: release-files-ios
          path: comic-reader-v1.0.${{ github.run_number }}.ipa

  release:
    needs: [ build_android, build_ios ]
    if: always() && (needs.build_android.result == 'success' || needs.build_ios.result == 'success')
    runs-on: ubuntu-latest
    steps:
      - name: Download Android APK
        if: needs.build_android.result == 'success'
        uses: actions/download-artifact@v4
        with:
          name: release-files-android
          path: release_assets

      - name: Download iOS IPA
        if: needs.build_ios.result == 'success'
        uses: actions/download-artifact@v4
        with:
          name: release-files-ios
          path: release_assets

      - name: Create Versioned GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.${{ github.run_number }}
          name: Release v1.0.${{ github.run_number }}
          generate_release_notes: true
          files: release_assets/*
